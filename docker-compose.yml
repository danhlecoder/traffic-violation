version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traffic_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend:rw
      - ./requirements.txt:/app/requirements.txt:ro
      - ./logs:/app/logs:rw
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: traffic_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend:rw
      - /app/frontend/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: traffic_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

networks:
  default:
    name: traffic_net
    driver: bridge

volumes:
  mongo_data:
