# Static Configuration - Tham số tĩnh ít thay đổi

# Server
server:
  host: "0.0.0.0"
  port: 8000
  allowed_origins: "*"

# Logging
logging:
  level: INFO
  file: /app/logs/backend.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

# External Services (Docker network internal)
services:
  mongo_api: "http://mongo_api:8002"

# YOLO Vehicle Detection (Local Model)
yolo_vehicle:
  model_path: /app/backend/models/best.pt
  conf_threshold: 0.5
  iou_threshold: 0.45
  device: cuda  # Mặc định GPU (cuda), fallback CPU nếu không có GPU

# License Plate OCR (Local Model)
license_plate:
  model_path: /app/backend/models/number_license_model.pt
  conf_threshold: 0.25  # Giảm xuống để tăng recall (nhận diện nhiều ký tự hơn)
  iou_threshold: 0.6
  device: cuda  # Mặc định GPU (cuda), fallback CPU nếu không có GPU

# Database
database:
  mongo_camera:
    host: mongo  # Docker service name (nội bộ)
    port: 27017
    database: traffic
    username: ""
    password: ""
    authSource: admin

# External Services
# Khi deploy distributed trên nhiều server, cấu hình URL tại đây
# services:
#   frontend_url: "http://<FRONTEND_IP>:3000"
#   backend_url: "http://<BACKEND_IP>:8000"
#   mongo_url: "mongodb://<MONGO_IP>:27017"