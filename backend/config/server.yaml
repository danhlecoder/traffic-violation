# Static Configuration - Tham số tĩnh ít thay đổi

# Server
server:
  host: "0.0.0.0"
  port: 8000
  allowed_origins: "*"

# Logging
logging:
  level: INFO
  file: /app/logs/backend.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

# YOLO Model
yolo:
  model_path: /app/backend/models/best1.pt
  device: cpu
  
# License Plate Text Recognition (YOLO Character Detection)
license_plate:
  model_path: /app/backend/models/license_plate.pt
  conf_threshold: 0.35
  iou_threshold: 0.6

# Database
database:
  mongo_camera:
    host: mongo
    port: 27017
    database: traffic
    username: ""
    password: ""
    authSource: admin