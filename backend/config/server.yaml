# Static Configuration - Tham số tĩnh ít thay đổi

# Server
server:
  host: "0.0.0.0"
  port: 8000
  allowed_origins: "*"

# Logging
logging:
  level: INFO
  file: /app/logs/backend.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

# External Services (Docker network internal)
services:
  mongo_api: "http://mongo_api:8002"

# YOLO Vehicle Detection (Local Model)
yolo_vehicle:
  model_path: /app/backend/models/best1.pt
  conf_threshold: 0.5
  iou_threshold: 0.45
  device: auto  # auto: dùng CUDA nếu có, không thì CPU

# License Plate OCR (Local Model)
license_plate:
  model_path: /app/backend/models/number_license_model.pt
  conf_threshold: 0.35
  iou_threshold: 0.6
  device: auto  # auto: dùng CUDA nếu có, không thì CPU

# Database
# Để chạy trên server riêng, đổi host thành IP server MongoDB
# VD: host: "192.168.1.100" hoặc "mongodb.example.com"
database:
  mongo_camera:
    host: mongo  # Đổi thành IP/domain của MongoDB server
    port: 27017
    database: traffic
    username: ""
    password: ""
    authSource: admin

# External Services (khi deploy distributed)
# Uncomment và config khi chạy trên nhiều server
# services:
#   frontend_url: "http://192.168.1.101:3000"  # Frontend server
#   backend_url: "http://192.168.1.102:8000"   # Backend server (YOLO AI)
#   mongo_url: "mongodb://192.168.1.103:27017" # MongoDB server