services:
  n8n:
    image: n8nio/n8n:latest
    container_name: traffic_n8n
    restart: unless-stopped
    ports:
      - "8001:5678"  # Localhost:8001 -> Container:5678
    environment:
      # Xác thực (TẮT để webhook hoạt động)
      - N8N_BASIC_AUTH_ACTIVE=false

      # Cấu hình server
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production

      # Múi giờ Việt Nam
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh

      # Workflow retention
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168  # 7 ngày

      # Webhook settings
      - N8N_PAYLOAD_SIZE_MAX=16
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows

    networks:
      - traffic_net

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  traffic_net:
    driver: bridge

volumes:
  n8n_data:
    driver: local

