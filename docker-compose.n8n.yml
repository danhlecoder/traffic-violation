services:
  n8n:
    image: n8nio/n8n:latest
    container_name: traffic_n8n
    restart: unless-stopped
    ports:
      - "0.0.0.0:8001:5678"
    environment:
      # Cấu hình xác thực cơ bản (TẮT để cho webhook hoạt động)
      - N8N_BASIC_AUTH_ACTIVE=false
      # - N8N_BASIC_AUTH_USER=admin
      # - N8N_BASIC_AUTH_PASSWORD=admin123

      # Cấu hình host và port
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production

      # Cấu hình webhook URL (thay đổi nếu cần)
      - WEBHOOK_URL=http://192.168.1.43:8001/

      # Cấu hình múi giờ Việt Nam
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh

      # Cấu hình kết nối MongoDB (nếu cần)
      - DB_TYPE=mongodb
      - DB_MONGODB_CONNECTION_URL=mongodb://admin:admin123@mongo:27017/n8n?authSource=admin

      # Cấu hình workflow
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168

      # Cấu hình CORS cho webhook (cho phép Frontend gọi)
      - N8N_PAYLOAD_SIZE_MAX=16
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true

    volumes:
      # Lưu trữ dữ liệu N8N
      - n8n_data:/home/node/.n8n

      # Mount workflows để lưu vào Git (tùy chọn)
      - ./n8n/workflows:/home/node/.n8n/workflows

    networks:
      - traffic_net

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  traffic_net:
    driver: bridge

volumes:
  n8n_data:
    driver: local

