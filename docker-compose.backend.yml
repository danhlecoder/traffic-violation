services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traffic_backend
    restart: unless-stopped
    ports:
      - "8000:8000"  # Localhost:8000 -> Container:8000
    volumes:
      - ./backend:/app/backend
      - ./backend/models:/app/backend/models:ro  # Read-only models
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    networks:
      - traffic_net

networks:
  traffic_net:
    driver: bridge
