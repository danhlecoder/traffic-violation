services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: traffic_frontend
    restart: unless-stopped
    ports:
      - "3000:5173"  # Localhost:3000 -> Container:5173 (Vite dev server)
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - NODE_ENV=production
    networks:
      - traffic_net

networks:
  traffic_net:
    driver: bridge
